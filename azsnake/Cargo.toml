[package]
name = "azsnake"
version = "0.1.0"
edition = "2024"
description = "AlphaZero 1v1 Snake (20x20) on Metal: tch-rs resnet, batched self-play over the lab's snake Duel"

# Standalone on purpose (like azgo/): keeps libtorch out of the main
# workspace, so `cargo test` at the repo root stays light. Build from this
# directory.
[workspace]

[dependencies]
snake = { path = "../games/snake" }
snakeinfer = { path = "../snakeinfer" }
game-core = { path = "../game-core" }
solvers = { path = "../solvers" }
rayon = "1"
serde_json = "1"
tch = { version = "0.23", features = ["download-libtorch"] }

[profile.release-dbg]
inherits = "release"
debug-assertions = true
debug = true
