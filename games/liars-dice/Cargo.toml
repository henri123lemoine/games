[package]
name = "liars-dice"
version = "0.1.0"
edition = "2024"
description = "Liar's Dice (imperfect-information variant) as a game-core Game"

[lib]
name = "liars_dice"
path = "src/lib.rs"

[features]
# Turns on `solvers`' rayon-parallel net-gradient kernels for the Deep CFR
# trainer (`deepcfr.rs` / the `deepcfr_train` example). Off by default so `lab`
# keeps controlling solver parallelism through its own `parallel` feature; the
# distillation trainer parallelizes data generation through liars-dice's own
# direct rayon dependency regardless.
parallel = ["solvers/parallel"]
# Route the data-gen net forward through the Metal GPU batched-inference server
# (macOS only; opt-in). Off by default — the Accelerate/AMX CPU path stays the
# default and the only fallback. See `solvers::rebel_gpu`.
gpu = ["solvers/gpu"]

[dependencies]
game-core = { workspace = true }
# The fitted value iteration (`solve.rs`) solves each per-round subgame with
# `solvers::Cfr`, so the solver is a library dependency, not just dev. There is
# no cycle: `solvers` depends only on `game-core`. Default features off (no
# `parallel`) to match `lab` and avoid forcing rayon on dependents; the small
# verification configs solve fast single-threaded.
solvers = { path = "../../solvers", default-features = false }
# Parallel self-play data generation for net training (`train.rs`); rayon is
# already in the workspace (used by `solvers`). Fans independent per-round solves
# across a bounded thread pool.
rayon = { workspace = true }
serde_json = "1"
