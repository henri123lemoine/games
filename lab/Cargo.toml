[package]
name = "lab"
version = "0.1.0"
edition = "2024"
description = "The lab's binding layer: a registry of games and bots, type-erased matches, and the generic terminal client"

[lib]
name = "lab"
path = "src/lib.rs"

[[bin]]
name = "lab"
path = "src/main.rs"

[features]
default = ["parallel"]
parallel = ["dep:rayon", "solvers/parallel"]

[dependencies]
game-core = { workspace = true }
rayon = { workspace = true, optional = true }
solvers = { path = "../solvers", default-features = false }
chess = { path = "../games/chess" }
four-player-chess = { path = "../games/four-player-chess" }
liars-dice = { path = "../games/liars-dice" }
twentyone = { path = "../games/twentyone" }
othello = { path = "../games/othello" }
go = { path = "../games/go" }
connect4 = { path = "../games/connect4" }
snake = { path = "../games/snake" }
pente = { path = "../games/pente" }
poker = { path = "../games/poker" }
stratego = { path = "../games/stratego" }
nn-infer = { path = "../ml/nn-infer" }
