[project]
name = "stratego-trainer"
version = "0.1.0"
description = "MLX self-play training loop + the three Ataraxos Stratego transformers."
requires-python = ">=3.12"
dependencies = [
    "mlx==0.31.2",
    "numpy>=2.0",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stratego_nets*", "stratego_trainer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
