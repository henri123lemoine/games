# Workspace for the games lab: `game-core` holds the shared contract (the Game
# trait, capability traits, the match arena); `solvers` holds the algorithms;
# `games/*` are games implemented against it.
[workspace]
resolver = "2"
members = ["game-core", "solvers", "games/liars-dice", "games/twentyone", "games/chess", "games/othello", "games/go", "games/connect4", "games/snake", "games/pente", "games/poker", "games/stratego", "lab", "web/engine", "ml/nn-infer"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
game-core = { path = "game-core" }
rayon = "1.10"
