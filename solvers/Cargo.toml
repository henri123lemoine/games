[package]
name = "solvers"
version = "0.1.0"
edition = "2024"
description = "Generic game-playing algorithms over game-core's traits: CFR variants, exact exploitability, alpha-beta search, determinized Monte-Carlo rollouts"

[lib]
name = "solvers"
path = "src/lib.rs"

[features]
default = ["parallel"]
parallel = ["dep:rayon", "gemm/rayon"]
# Metal GPU batched-inference path for the ReBeL value-net forward (macOS only;
# opt-in). The default build keeps the Accelerate/AMX CPU path; this only adds an
# alternative forward used when liars-dice's matching `gpu` feature is on.
gpu = [
    "dep:objc2",
    "dep:objc2-metal",
    "dep:objc2-metal-performance-shaders",
    "dep:objc2-foundation",
    "dep:crossbeam-channel",
]

[dependencies]
game-core = { workspace = true }
rayon = { workspace = true, optional = true }
gemm = { version = "0.19", default-features = false, features = ["std"] }
web-time = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true }
objc2-metal-performance-shaders = { version = "0.3", optional = true }
objc2-foundation = { version = "0.3", optional = true }
crossbeam-channel = { version = "0.5", optional = true }

[dev-dependencies]
chess = { path = "../games/chess" }
