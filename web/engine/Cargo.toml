[package]
name = "web-engine"
version = "0.1.0"
edition = "2024"
description = "wasm-bindgen bindings over the lab's registry and matches: the browser engine for the games arcade (see web/DESIGN.md)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nn-infer = { path = "../../ml/nn-infer" }
solvers = { path = "../../solvers", default-features = false }
chess = { path = "../../games/chess" }
four-player-chess = { path = "../../games/four-player-chess" }
go = { path = "../../games/go" }
pente = { path = "../../games/pente" }
snake = { path = "../../games/snake" }
game-core = { workspace = true }
lab = { path = "../../lab", default-features = false }
serde_json = "1"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
