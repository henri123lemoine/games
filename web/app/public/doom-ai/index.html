<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOOM — The Foundry FFA</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
      #stage { position:fixed; inset:0; display:grid; place-items:center; background:#000; }
      #canvas { width:min(100vw,160vh); height:min(62.5vw,100vh); display:block; background:#000; image-rendering:pixelated; outline:none; }
      #pause-overlay,#overlay { position:fixed; inset:0; z-index:20; display:grid; place-items:center; pointer-events:none; }
      #pause-overlay[hidden],#overlay[hidden] { display:none; }
      .native-hitbox { position:relative; width:min(100vw,160vh); height:min(62.5vw,100vh); pointer-events:none; }
      .native-hitbox button { position:absolute; left:30%; width:40%; height:10%; border:0; opacity:0; cursor:pointer; pointer-events:auto; }
      #pause-continue { top:43%; }
      #pause-home { top:53%; }
      #setup-bots { top:39%; }
      #setup-difficulty { top:49%; }
      #start { top:61%; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="canvas" width="640" height="400" tabindex="0"></canvas></div>
    <div id="pause-overlay" role="dialog" aria-modal="true" aria-label="Paused" hidden>
      <div class="native-hitbox">
        <button id="pause-continue" type="button" aria-label="Continue"></button>
        <button id="pause-home" type="button" aria-label="Home"></button>
      </div>
    </div>
    <div id="overlay" role="dialog" aria-modal="true" aria-label="Doom match setup">
      <div class="native-hitbox">
        <button id="setup-bots" type="button" aria-label="AI opponents"></button>
        <button id="setup-difficulty" type="button" aria-label="AI difficulty"></button>
        <button id="start" type="button" aria-label="Fight"></button>
      </div>
    </div>
    <script type="module" src="./game.js"></script>
  </body>
</html>
