[package]
name = "azgo"
version = "0.1.0"
edition = "2024"
description = "AlphaZero go (9x9) on Metal: tch-rs resnet, batched self-play over the lab's go crate, GNU Go-anchored Elo gauge"

# Standalone on purpose (like azt/): keeps libtorch out of the main
# workspace, so `cargo test` at the repo root stays light. Build from this
# directory.
[workspace]

[dependencies]
go = { path = "../games/go" }
game-core = { path = "../game-core" }
solvers = { path = "../solvers" }
rayon = "1"
serde_json = "1"
tch = { version = "0.23", features = ["download-libtorch"] }

[profile.release-dbg]
inherits = "release"
debug-assertions = true
debug = true
